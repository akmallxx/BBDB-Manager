[package]
name = "bbdb-manager"
version = "1.0.0"
description = "BBDB Manager - Modern Desktop SQL Studio"
authors = ["akmallxx"]
edition = "2021"

[lib]
name = "bbdb_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
