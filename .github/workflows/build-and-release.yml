name: Build & Release Desktop

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: Linux-x86_64
            args: ''
          - platform: windows-latest
            name: Windows-x86_64
            args: ''
          - platform: macos-latest
            name: macOS-ARM64
            args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare Environment File
        shell: bash
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Setting TAURI_VERSION to ${TAG_VERSION}"
            echo "TAURI_VERSION=${TAG_VERSION}" >> $GITHUB_ENV
          fi

      - name: Install JavaScript dependencies
        run: bun install

      - name: Sync Tauri configuration
        run: bun run tauri:sync

      # 1. Build and Publish GitHub Release when a git tag (v*) is pushed
      - name: Build & Publish Release (Git Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BBDB Manager ${{ github.ref_name }}'
          releaseBody: |
            Automated release for **BBDB Manager** (${{ github.ref_name }}).

            ### Binaries available:
            - **Linux**: `.AppImage`, `.deb`, `.rpm`
            - **Windows**: `.msi`, `.exe`
            - **macOS**: `.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 2. Build without release on push to branch / pull request / manual dispatch
      - name: Build Tauri Desktop (CI / Non-Tag)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # 3. Upload built binaries as downloadable artifacts in GitHub Actions
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bbdb-manager-${{ matrix.name }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14
